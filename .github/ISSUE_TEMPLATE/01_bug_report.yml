name: Bug report
description: Report a problem with Tarp
labels: ["bug"]
body:
  - type: checkboxes
    attributes:
      label: Pre-submission checklist
      options:
        - label: "I have searched existing issues and there are no duplicates"
          required: true
        - label: "This issue reproduces in Tarp specifically (not only in another terminal)"
          required: false
  - type: textarea
    attributes:
      label: Describe the bug
      description: A clear description of what went wrong, including steps to reproduce, what you expected, and what actually happened.
      placeholder: |
        1. ...
        2. ...
        Expected: ...
        Actual: ...
    validations:
      required: true
  - type: input
    attributes:
      label: Tarp version
      description: The version or commit you're running.
    validations:
      required: false
  - type: input
    attributes:
      label: OS / platform
      description: e.g. macOS 15 (Apple Silicon), Ubuntu 24.04 (Wayland/X11), Windows 11.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Logs / additional context
      description: |
        Attach logs if relevant. On Linux, for graphical issues you can run with
        `RUST_LOG=wgpu_core=info,wgpu_hal=info MESA_DEBUG=1 EGL_LOG_LEVEL=debug tarp`
        and include the output and `eglinfo`.
    validations:
      required: false
