name: Feature request
description: Suggest an improvement for Tarp
labels: ["enhancement"]
body:
  - type: checkboxes
    attributes:
      label: Pre-submission checklist
      options:
        - label: "I have searched existing issues and there are no duplicates"
          required: true
        - label: "This fits Tarp's scope: a plain terminal (no AI, cloud, or accounts)"
          required: false
  - type: textarea
    attributes:
      label: Problem
      description: What problem would this feature solve? What are you trying to do?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed solution
      description: Describe the feature or change you'd like. Mention alternatives you've considered.
    validations:
      required: false
