# Please see the documentation for all configuration options:
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
    # Security updates only (not general version bumps) — matches Tarp's
    # security fast-track sync cadence (see docs/08-upstream-sync.md).
    open-pull-requests-limit: 0
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      # Don't update to any action release that is less than two weeks old.
      default-days: 14
    groups:
      # Group all non-major updates of official actions together — they're lower-risk.
      official-actions:
        applies-to: version-updates
        patterns:
          - "actions/*"
        update-types:
          - "minor"
          - "patch"
