name: CI

# Minimal CI for Tarp. Replaces Warp's 858-line ci.yml (which depended on Warp
# infra: GCP WIF, Namespace runners, trunk.io, repo-sync). This is intentionally
# small — a formatting gate plus a Linux build smoke test — and is meant to be
# expanded (clippy -D warnings, nextest, macOS/Windows build checks) as the
# de-Warp work settles. See docs/removal/ci-plan.md for the full plan.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show           # installs the channel pinned in rust-toolchain.toml
      - name: Check formatting
        run: cargo fmt --all -- --check

  build:
    name: build (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system build dependencies
        run: ./script/linux/install_build_deps
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Build the terminal (OSS, no AI/cloud features)
        run: cargo build --bin tarp --features gui
      # clippy runs informationally for now: the tree still carries inert
      # `voice_input` cfg warnings from the de-Warp. Promote to `-D warnings`
      # once those are cleaned up.
      - name: Clippy (non-blocking)
        run: cargo clippy --bin tarp --features gui || true
