name: Release

# Tag-driven release for Tarp. Pushing a semver tag (vX.Y.Z) builds the OSS
# bundle and publishes a GitHub Release with the artifacts attached. You can
# also dry-run the build from the Actions tab via workflow_dispatch (no Release
# is created unless you opt in).
#
# Releases are SIGNED (Developer ID) + NOTARIZED when the Apple secrets below are
# configured in the repo (they are) — Gatekeeper accepts the download cleanly. If
# the cert secret is ever absent, the build falls back to a valid ad-hoc signature
# (openable via a one-time Gatekeeper step; see docs). Secrets used:
#   APPLE_DEVELOPER_ID_CERT           base64 of the Developer ID Application .p12
#   APPLE_DEVELOPER_ID_CERT_PASSWORD  password for that .p12
#   APPLE_TEAM_ID                     10-char Apple Developer Team ID
#   APPLE_CODESIGN_KEYCHAIN_PASSWORD  arbitrary; scoped to the CI keychain
#   APPLE_NOTARIZATION_API_KEY        base64 of the App Store Connect .p8 key
#   APPLE_NOTARIZATION_API_KEY_ID     the key ID (filename is AuthKey_<id>.p8)
#   APPLE_NOTARIZATION_API_ISSUER     the API key's issuer ID (UUID)
#
# See docs/RELEASING.md for the full flow.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to (re)build, e.g. v0.1.0 (used as the Release tag when publish=true)'
        required: false
      publish:
        description: 'Publish a GitHub Release (otherwise build-only dry run)'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # create the GitHub Release + upload assets

jobs:
  # Fast, cheap gate BEFORE the ~1.5h macOS build: refuse to ship off a commit
  # that isn't formatted or doesn't compile. Runs on Linux (fmt is OS-agnostic;
  # a Linux compile check catches the shared-code breakage cheaply) and reuses
  # the warm "linux" cache that CI keeps fresh on main. Mac-only compile errors
  # still surface in the build job below.
  preflight:
    name: Preflight (fmt + check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Install system build dependencies
        run: ./script/linux/install_build_deps
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux
          cache-all-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Compile check (gui)
        run: cargo check --locked --bin tarp --features gui

  build-macos:
    name: Build macOS (arm64)
    needs: preflight
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: macos
          is_self_hosted: 'false'
          install_release_deps: 'true'   # installs cargo-about -> THIRD_PARTY_LICENSES.txt

      - name: Install create-dmg
        run: brew install create-dmg

      # The pinned cargo-bundle fork is required for the .app bundle step.
      # (Built from source rather than Warp's GCS-cached binary so the release
      # has no upstream-infra dependency.) Keep the rev in sync with BUILD.md.
      - name: Install pinned cargo-bundle
        run: |
          if ! command -v cargo-bundle >/dev/null 2>&1; then
            cargo install cargo-bundle \
              --git=https://github.com/burtonageo/cargo-bundle \
              --rev ae4c76e92c08774bf54ff077b1c52e3d1cd6c16d
          fi

      - name: Determine signing mode
        id: sign
        env:
          CERT: ${{ secrets.APPLE_DEVELOPER_ID_CERT }}
        run: |
          if [ -n "$CERT" ]; then
            echo "mode=signed" >> "$GITHUB_OUTPUT"
            echo "Signing secrets present -> building a signed + notarized bundle."
          else
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
            echo "No signing secrets -> building an unsigned bundle (v1 default)."
          fi

      # arm64-only (--nouniversal) for v1: the runner is Apple Silicon and that
      # is Tarp's target platform. A universal2 build is a later enhancement.
      - name: Bundle OSS (unsigned)
        if: steps.sign.outputs.mode == 'unsigned'
        # --release-tag compiles the version (GIT_RELEASE_TAG) into the binary so
        # the About page shows it (app_version() reads option_env!("GIT_RELEASE_TAG")).
        run: ./script/bundle --channel oss --nouniversal --nosign --release-tag "${{ github.event.inputs.tag || github.ref_name }}"

      - name: Bundle OSS (signed + notarized)
        if: steps.sign.outputs.mode == 'signed'
        env:
          WARP_DEVELOPER_ID_CERT: ${{ secrets.APPLE_DEVELOPER_ID_CERT }}
          WARP_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          WARP_CODESIGN_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_CODESIGN_KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Notarization via App Store Connect API key (.p8). The key is stored
          # base64-encoded in the secret; decode it to a temp file the bundle
          # script points notarytool at.
          APPLE_NOTARIZATION_API_KEY: ${{ secrets.APPLE_NOTARIZATION_API_KEY }}
          WARP_NOTARIZATION_API_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_API_KEY_ID }}
          WARP_NOTARIZATION_API_ISSUER: ${{ secrets.APPLE_NOTARIZATION_API_ISSUER }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/notary_api_key.p8"
          printf '%s' "$APPLE_NOTARIZATION_API_KEY" | base64 -d > "$KEY_FILE"
          export WARP_NOTARIZATION_API_KEY_PATH="$KEY_FILE"
          ./script/bundle --channel oss --nouniversal --read-passwords-from-env --release-tag "${{ github.event.inputs.tag || github.ref_name }}"

      - name: Stage release artifacts
        id: stage
        run: |
          set -euo pipefail
          OUT="target/release-lto/bundle/osx"
          mkdir -p dist
          cp "$OUT/Tarp.dmg" "dist/Tarp-macos-arm64.dmg"
          # Third-party attribution generated during bundling.
          LIC="$OUT/Tarp.app/Contents/Resources/THIRD_PARTY_LICENSES.txt"
          if [ -f "$LIC" ]; then cp "$LIC" "dist/THIRD_PARTY_LICENSES.txt"; fi
          echo "Staged:"; ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: tarp-macos-arm64
          path: dist/**
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build-macos
    runs-on: ubuntu-latest
    # Publish on a tag push, or on a manual dispatch with publish=true.
    if: ${{ github.event_name == 'push' || github.event.inputs.publish == 'true' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/**

  # Auto-bump the Homebrew cask in ramsrib/homebrew-tap so `brew upgrade --cask
  # tarp` picks up the new version. Requires a HOMEBREW_TAP_TOKEN secret (a PAT
  # with contents:write on the tap repo) — the cross-repo push can't use the
  # default GITHUB_TOKEN. If the secret is absent, this is skipped (bump the cask
  # manually) so the release still succeeds.
  bump-cask:
    name: Bump Homebrew cask
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Check for tap token
        id: tok
        env:
          TOK: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "$TOK" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HOMEBREW_TAP_TOKEN not set — skipping cask bump (bump it manually)."
          fi
      - name: Update the cask (version + sha256) and push to the tap
        if: steps.tok.outputs.have == 'true'
        env:
          TOK: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          DMG_URL="https://github.com/ramsrib/tarp/releases/download/${TAG}/Tarp-macos-arm64.dmg"
          curl -fL "$DMG_URL" -o tarp.dmg
          SHA="$(sha256sum tarp.dmg | awk '{print $1}')"
          git clone --depth 1 "https://x-access-token:${TOK}@github.com/ramsrib/homebrew-tap.git" tap
          cd tap
          sed -i -E "s|^  version \".*\"|  version \"${VER}\"|" Casks/tarp.rb
          sed -i -E "s|^  sha256 \".*\"|  sha256 \"${SHA}\"|" Casks/tarp.rb
          if git diff --quiet; then
            echo "Cask already at ${VER}; nothing to bump."
          else
            git -c user.name="tarp-release[bot]" -c user.email="tarp-release@users.noreply.github.com" \
              commit -am "tarp: bump cask to ${VER}"
            git push origin HEAD:main
            echo "Bumped tarp cask to ${VER} (sha ${SHA})."
          fi
